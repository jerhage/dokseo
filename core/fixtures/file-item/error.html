<li class="file-item is-error">
  <span aria-hidden="true" class="file-item-icon-frame">
    <svg
      aria-hidden="true"
      class="file-item-icon lucide lucide-circle-x"
      fill="none"
      height="24"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      viewBox="0 0 24 24"
      width="24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <path d="m15 9-6 6"></path>
      <path d="m9 9 6 6"></path>
    </svg>
  </span>
  <div class="file-item-content">
    <span class="file-item-name">big.zip</span>
    <span class="file-item-detail">The file is too large</span>
  </div>
  <button aria-label="Remove big.zip" class="file-item-remove" type="button">
    <svg
      aria-hidden="true"
      class="close-icon lucide lucide-x"
      fill="none"
      height="24"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      viewBox="0 0 24 24"
      width="24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="M18 6 6 18"></path>
      <path d="m6 6 12 12"></path>
    </svg>
  </button>
</li>
