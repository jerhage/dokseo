<section aria-label="Handshake, step by step" class="step-through">
  <div class="step-through-stage">
    <div
      aria-label="A TLS-like handshake"
      class="sequence"
      role="group"
      style="--sequence-columns: 2;"
    >
      <div class="sequence-participants">
        <div class="sequence-participant">Client</div>
        <div class="sequence-participant">Server</div>
      </div>
      <div class="sequence-body">
        <div aria-hidden="true" class="sequence-lifeline" style="--sequence-index: 1;"></div>
        <div aria-hidden="true" class="sequence-lifeline" style="--sequence-index: 2;"></div>
        <div
          class="sequence-message step-through-dimmed"
          style="--sequence-end: 2; --sequence-start: 1;"
        >
          <span class="visually-hidden">Client to Server:</span>
          <span class="sequence-message-label">ClientHello</span>
        </div>
        <div
          class="sequence-message sequence-message-active sequence-message-reverse"
          style="--sequence-end: 2; --sequence-start: 1;"
        >
          <span class="visually-hidden">Server to Client:</span>
          <span class="sequence-message-label">ServerHello, Certificate</span>
        </div>
        <div
          class="sequence-message step-through-dimmed"
          style="--sequence-end: 2; --sequence-start: 1;"
        >
          <span class="visually-hidden">Client to Server:</span>
          <span class="sequence-message-label">Finished</span>
        </div>
        <div
          class="sequence-message sequence-message-dashed sequence-message-reverse step-through-dimmed"
          style="--sequence-end: 2; --sequence-start: 1;"
        >
          <span class="visually-hidden">Server to Client:</span>
          <span class="sequence-message-label">Finished</span>
        </div>
      </div>
    </div>
  </div>
  <p aria-live="polite" class="step-through-caption">
    The server answers with its certificate so the client can check who it is talking to.
  </p>
  <div class="step-through-controls">
    <button class="btn btn-ghost btn-sm btn-square" title="Previous step" type="button">
      <svg
        aria-hidden="true"
        class="btn-icon lucide lucide-chevron-left"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="m15 18-6-6 6-6"></path>
      </svg>
      <span class="visually-hidden">Previous step</span>
    </button>
    <span class="step-through-counter">Step 2 of 4</span>
    <button class="btn btn-ghost btn-sm btn-square" title="Next step" type="button">
      <svg
        aria-hidden="true"
        class="btn-icon lucide lucide-chevron-right"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="m9 18 6-6-6-6"></path>
      </svg>
      <span class="visually-hidden">Next step</span>
    </button>
  </div>
</section>
