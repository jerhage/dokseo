<div class="combobox">
  <label class="field-label" for="id-1" id="id-2">Language</label>
  <div class="combobox-control">
    <input
      aria-autocomplete="list"
      aria-controls="id-3"
      aria-expanded="false"
      autocomplete="off"
      class="input"
      id="id-1"
      role="combobox"
      type="text"
      value="Korean"
    >
    <div aria-labelledby="id-2" class="combobox-listbox" id="id-3" popover="manual" role="listbox">
      <div aria-selected="false" class="combobox-option" id="id-4" role="option">Japanese</div>
      <div aria-selected="true" class="combobox-option is-active" id="id-5" role="option">
        Korean
      </div>
      <div aria-selected="false" class="combobox-option" id="id-6" role="option">English</div>
    </div>
  </div>
</div>
