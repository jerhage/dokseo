<div aria-label="A highlighted step" class="sequence" role="group" style="--sequence-columns: 2;">
  <div class="sequence-participants">
    <div class="sequence-participant">Client</div>
    <div class="sequence-participant">Server</div>
  </div>
  <div class="sequence-body">
    <div aria-hidden="true" class="sequence-lifeline" style="--sequence-index: 1;"></div>
    <div aria-hidden="true" class="sequence-lifeline" style="--sequence-index: 2;"></div>
    <div class="sequence-message" style="--sequence-end: 2; --sequence-start: 1;">
      <span class="visually-hidden">Client to Server:</span>
      <span class="sequence-message-label">ClientHello</span>
    </div>
    <div
      class="sequence-message sequence-message-active sequence-message-reverse"
      style="--sequence-end: 2; --sequence-start: 1;"
    >
      <span class="visually-hidden">Server to Client:</span>
      <span class="sequence-message-label">ServerHello</span>
    </div>
    <div class="sequence-note sequence-note-active" style="--sequence-end: 2; --sequence-start: 1;">
      Keys are agreed
    </div>
  </div>
</div>
