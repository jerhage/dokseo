<div
  aria-label="A packet header with one field active"
  class="packet"
  role="region"
  style="--packet-bits: 32;"
  tabindex="0"
>
  <div aria-hidden="true" class="packet-ruler">
    <span class="packet-offset" style="--packet-offset: 0;">0</span>
    <span class="packet-offset" style="--packet-offset: 8;">8</span>
    <span class="packet-offset" style="--packet-offset: 16;">16</span>
    <span class="packet-offset" style="--packet-offset: 24;">24</span>
  </div>
  <div class="packet-row">
    <div class="packet-field" style="--packet-span: 4;">
      <span class="packet-field-name">Version</span>
      <span class="packet-field-detail">4 bits</span>
    </div>
    <div class="packet-field" style="--packet-span: 4;">
      <span class="packet-field-name">Header length</span>
      <span class="packet-field-detail">4 bits</span>
    </div>
    <div class="packet-field packet-field-active packet-field-primary" style="--packet-span: 8;">
      <span class="packet-field-name">Flags</span>
      <span class="packet-field-detail">8 bits</span>
    </div>
    <div class="packet-field" style="--packet-span: 16;">
      <span class="packet-field-name">Total length</span>
      <span class="packet-field-detail">16 bits</span>
    </div>
  </div>
</div>
