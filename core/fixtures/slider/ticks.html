<div class="slider-wrapper">
  <input
    aria-label="Zoom"
    class="slider"
    dir="ltr"
    max="100"
    min="0"
    step="1"
    type="range"
    value="50"
  >
  <span aria-hidden="true" class="slider-tick" style="--slider-tick-at: 0%;"></span>
  <span aria-hidden="true" class="slider-tick" style="--slider-tick-at: 50%;"></span>
  <span aria-hidden="true" class="slider-tick" style="--slider-tick-at: 100%;"></span>
</div>
