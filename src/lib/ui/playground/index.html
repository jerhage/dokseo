<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kandan UI playground</title>
    <style>
      @layer open-props, reset, base, tokens, components, features, utilities, overrides;
    </style>
    <script>
      {
        const themes = ['base', 'petal', 'yorha', 'crayon', 'ember', 'mono', 'forge', 'moss'];
        const schemes = ['light', 'dark'];
        let theme = 'base';
        let scheme = null;
        try {
          const storedTheme = localStorage.getItem('kandan.theme');
          const storedScheme = localStorage.getItem('kandan.color-scheme');
          if (themes.includes(storedTheme)) theme = storedTheme;
          if (schemes.includes(storedScheme)) scheme = storedScheme;
        } catch {}
        document.documentElement.setAttribute('data-theme', theme);
        if (scheme !== null) document.documentElement.setAttribute('data-color-scheme', scheme);
      }
    </script>
    <script type="module" src="./main.ts"></script>
  </head>
  <body></body>
</html>
