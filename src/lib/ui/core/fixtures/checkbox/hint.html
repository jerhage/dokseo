<label class="checkbox-wrapper">
  <input class="checkbox-input" type="checkbox">
  <svg
    aria-hidden="true"
    class="checkbox-check checkbox-icon lucide lucide-check"
    fill="none"
    height="24"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    viewBox="0 0 24 24"
    width="24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path d="M20 6 9 17l-5-5"></path>
  </svg>
  <svg
    aria-hidden="true"
    class="checkbox-dash checkbox-icon lucide lucide-minus"
    fill="none"
    height="24"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    viewBox="0 0 24 24"
    width="24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path d="M5 12h14"></path>
  </svg>
  <span class="checkbox-label">
    Remember me
    <span class="field-hint">Stay signed in on this device</span>
  </span>
</label>
