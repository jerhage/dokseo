<ul class="file-list">
  <li class="file-item">
    <span aria-hidden="true" class="file-item-icon-frame">
      <svg
        aria-hidden="true"
        class="file-item-icon lucide lucide-file"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
        >
        </path>
        <path d="M14 2v5a1 1 0 0 0 1 1h5"></path>
      </svg>
    </span>
    <div class="file-item-content">
      <span class="file-item-name">notes.txt</span>
      <span class="file-item-detail">2.0 KB</span>
    </div>
    <button aria-label="Remove notes.txt" class="file-item-remove" type="button">
      <svg
        aria-hidden="true"
        class="close-icon lucide lucide-x"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M18 6 6 18"></path>
        <path d="m6 6 12 12"></path>
      </svg>
    </button>
  </li>
  <li class="file-item is-complete">
    <span aria-hidden="true" class="file-item-icon-frame">
      <svg
        aria-hidden="true"
        class="file-item-icon lucide lucide-circle-check"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m16 9-5.5 5.5L8 12"></path>
      </svg>
    </span>
    <div class="file-item-content">
      <span class="file-item-name">book.epub</span>
      <span class="file-item-detail">1.0 MB</span>
    </div>
    <button aria-label="Remove book.epub" class="file-item-remove" type="button">
      <svg
        aria-hidden="true"
        class="close-icon lucide lucide-x"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M18 6 6 18"></path>
        <path d="m6 6 12 12"></path>
      </svg>
    </button>
  </li>
</ul>
