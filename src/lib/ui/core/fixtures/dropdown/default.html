<div class="dropdown" role="presentation">
  <button
    aria-controls="id-1"
    aria-expanded="false"
    aria-haspopup="menu"
    class="btn dropdown-trigger"
    id="id-2"
    type="button"
  >
    Sort
    <svg
      aria-hidden="true"
      class="dropdown-icon lucide lucide-chevron-down"
      fill="none"
      height="24"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      viewBox="0 0 24 24"
      width="24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="m6 9 6 6 6-6"></path>
    </svg>
  </button>
  <div aria-labelledby="id-2" class="dropdown-menu" id="id-1" popover="manual" role="menu">
    <span class="dropdown-label eyebrow" role="presentation">Order</span>
    <button
      aria-checked="true"
      class="dropdown-item is-active"
      role="menuitemradio"
      tabindex="-1"
      type="button"
    >
      Newest
    </button>
    <button
      aria-checked="false"
      class="dropdown-item"
      role="menuitemradio"
      tabindex="-1"
      type="button"
    >
      Oldest
    </button>
    <div class="dropdown-separator" role="separator"></div>
    <button class="dropdown-item dropdown-item-danger" role="menuitem" tabindex="-1" type="button">
      Clear
    </button>
  </div>
</div>
