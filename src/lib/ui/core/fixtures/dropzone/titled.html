<label class="dropzone">
  <input accept=".epub,.pdf" class="dropzone-input" multiple="" type="file">
  <span aria-hidden="true" class="dropzone-icon-frame">
    <svg
      aria-hidden="true"
      class="dropzone-icon lucide lucide-upload"
      fill="none"
      height="24"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      viewBox="0 0 24 24"
      width="24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="M12 3v12"></path>
      <path d="m17 8-5-5-5 5"></path>
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    </svg>
  </span>
  <span class="dropzone-title">Drop a book</span>
  <span class="dropzone-hint">EPUB or PDF, up to 50 MB</span>
</label>
