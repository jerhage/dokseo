<section aria-label="Route, step by step" class="step-through">
  <div class="step-through-stage">
    <div aria-label="Route of a packet" class="diagram-scroll" role="region" tabindex="0">
      <svg
        aria-labelledby="id-1"
        class="diagram"
        role="img"
        style="--diagram-width: 560px;"
        viewBox="0 0 560 120"
      >
        <title id="id-1">Route of a packet</title>
        <defs>
          <marker
            id="id-2"
            markerHeight="6"
            markerWidth="6"
            orient="auto-start-reverse"
            refX="10"
            refY="5"
            viewBox="0 0 10 10"
          >
            <path class="diagram-arrowhead" d="M 0 0 L 10 5 L 0 10 z"></path>
          </marker>
          <marker
            id="id-3"
            markerHeight="6"
            markerWidth="6"
            orient="auto-start-reverse"
            refX="10"
            refY="5"
            viewBox="0 0 10 10"
          >
            <path class="diagram-arrowhead diagram-arrowhead-active" d="M 0 0 L 10 5 L 0 10 z">
            </path>
          </marker>
        </defs>
        <g class="step-through-dimmed">
          <rect class="diagram-box" height="48" width="120" x="20" y="40"></rect>
          <text
            class="diagram-label"
            dominant-baseline="central"
            text-anchor="middle"
            x="80"
            y="64"
          >
            Client
          </text>
        </g>
        <rect
          class="diagram-box diagram-box-active diagram-box-primary"
          height="48"
          width="120"
          x="220"
          y="40"
        >
        </rect>
        <text class="diagram-label" dominant-baseline="central" text-anchor="middle" x="280" y="64">
          Router
        </text>
        <g class="step-through-dimmed">
          <rect class="diagram-box" height="48" width="120" x="420" y="40"></rect>
          <text
            class="diagram-label"
            dominant-baseline="central"
            text-anchor="middle"
            x="480"
            y="64"
          >
            Server
          </text>
        </g>
        <line
          class="diagram-edge diagram-edge-active"
          marker-end="url(#id-3)"
          x1="140"
          x2="220"
          y1="64"
          y2="64"
        >
        </line>
        <text
          class="diagram-edge-label diagram-edge-label-active"
          dy="-0.5em"
          text-anchor="middle"
          x="180"
          y="64"
        >
          packet
        </text>
        <line
          class="diagram-edge step-through-dimmed"
          marker-end="url(#id-2)"
          x1="340"
          x2="420"
          y1="64"
          y2="64"
        >
        </line>
      </svg>
    </div>
  </div>
  <p aria-live="polite" class="step-through-caption">The client hands the packet to the router.</p>
  <div class="step-through-controls">
    <button class="btn btn-ghost btn-sm btn-square" disabled="" title="Previous step" type="button">
      <svg
        aria-hidden="true"
        class="btn-icon lucide lucide-chevron-left"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="m15 18-6-6 6-6"></path>
      </svg>
      <span class="visually-hidden">Previous step</span>
    </button>
    <span class="step-through-counter">Step 1 of 3</span>
    <button class="btn btn-ghost btn-sm btn-square" title="Next step" type="button">
      <svg
        aria-hidden="true"
        class="btn-icon lucide lucide-chevron-right"
        fill="none"
        height="24"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="m9 18 6-6-6-6"></path>
      </svg>
      <span class="visually-hidden">Next step</span>
    </button>
  </div>
</section>
