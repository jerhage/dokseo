name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: deno install --frozen

      - run: npm run verify:ci
